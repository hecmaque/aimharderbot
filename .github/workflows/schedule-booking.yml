name: Aimharder Bot Schedule

on:
  schedule:
    # 30 5 * * * en UTC equivale a las 07:30h en España (Horario de Verano CEST / UTC+2)
    # En invierno (CET / UTC+1) deberás cambiarlo a: 30 6 * * *
    - cron: '30 5 * * *'
  workflow_dispatch: # Mantiene el botón para ejecutarlo manualmente desde GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargamos el código de tu repositorio a la máquina virtual
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Construimos la imagen Docker usando el Dockerfile de tu repositorio
      - name: Build Docker image
        run: docker build -t aimharderbot:latest .

      # 3. Creamos el archivo de configuración
      - name: Create config file
        env:
          AIMHARDER_EMAIL: ${{ secrets.AIMHARDER_EMAIL }}
          AIMHARDER_PASSWORD: ${{ secrets.AIMHARDER_PASSWORD }}
          AIMHARDER_BOX_NAME: ${{ secrets.BOX_NAME }}
          AIMHARDER_BOX_ID: ${{ secrets.BOX_ID }}
          AIMHARDER_BOOKING_GOALS: ${{ secrets.BOOKING_GOALS }}
          AIMHARDER_HOURS_IN_ADVANCE: ${{ secrets.AIMHARDER_HOURS_IN_ADVANCE }}
          HOURS_IN_ADVANCE: ${{ secrets.HOURS_IN_ADVANCE }}
        run: |
          mkdir -p /tmp/aimharderbot-config
          python3 <<'PY'
          import json, os

          def clean_secret(var_name):
              val = os.environ.get(var_name, '')
              return val.strip().strip('"').strip("'")

          secrets = {
              'AIMHARDER_EMAIL': clean_secret('AIMHARDER_EMAIL'),
              'AIMHARDER_PASSWORD': clean_secret('AIMHARDER_PASSWORD'),
              'AIMHARDER_BOX_NAME': clean_secret('AIMHARDER_BOX_NAME'),
              'AIMHARDER_BOX_ID': clean_secret('AIMHARDER_BOX_ID'),
              'AIMHARDER_HOURS_IN_ADVANCE': clean_secret('AIMHARDER_HOURS_IN_ADVANCE'),
              'AIMHARDER_BOOKING_GOALS': clean_secret('AIMHARDER_BOOKING_GOALS'),
          }

          if not secrets['AIMHARDER_HOURS_IN_ADVANCE']:
              secrets['AIMHARDER_HOURS_IN_ADVANCE'] = clean_secret('HOURS_IN_ADVANCE')

          missing = [k for k, v in secrets.items() if not v and k != 'AIMHARDER_HOURS_IN_ADVANCE']
          if missing:
              raise SystemExit(f"Missing secrets: {', '.join(missing)}")

          if not secrets['AIMHARDER_HOURS_IN_ADVANCE']:
              print('WARNING: HOURS_IN_ADVANCE secret not found; using default 24')
              secrets['AIMHARDER_HOURS_IN_ADVANCE'] = '24'

          try:
              goals = json.loads(secrets['AIMHARDER_BOOKING_GOALS'])
          except json.JSONDecodeError as ex:
              raise SystemExit(f"AIMHARDER_BOOKING_GOALS is not valid JSON: {ex.msg}")

          if not isinstance(goals, list) or not goals:
              raise SystemExit("AIMHARDER_BOOKING_GOALS must be a non-empty JSON array.")

          config_dict = {
              "user1": {
                  "box-name": secrets['AIMHARDER_BOX_NAME'],
                  "box-id": secrets['AIMHARDER_BOX_ID'],
                  "email": secrets['AIMHARDER_EMAIL'],
                  "password": secrets['AIMHARDER_PASSWORD'],
                  "booking-goals": goals,
                  "hours-in-advance": int(secrets['AIMHARDER_HOURS_IN_ADVANCE']),
                  "exceptions": {}
              }
          }

          with open('/tmp/aimharderbot-config/example_config.yaml', 'w') as f:
              json.dump(config_dict, f, indent=2)
          PY

      # 4. Verificamos que se haya generado correctamente
      - name: Verify generated config
        run: cat /tmp/aimharderbot-config/example_config.yaml

      # 5. Ejecutamos el contenedor con la imagen que acabamos de construir
      - name: Run Aimharderbot
        run: |
          docker run --rm \
            -v /tmp/aimharderbot-config:/usr/src/app/config \
            --name aimharderbot-scheduled \
            aimharderbot:latest \
            --config-filename='example_config.yaml'
