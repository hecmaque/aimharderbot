name: Schedule AimHarder booking

on:
  schedule:
    - cron: '6 16 * * *' # every day at 16:06 UTC (18:06 CEST Spain time)
  workflow_dispatch: {}

jobs:
  run-booking:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        if: github.repository_owner == 'hecmaque'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t aimharderbot:latest .

      - name: Run booking container
        env:
          AIMHARDER_EMAIL: ${{ secrets.AIMHARDER_EMAIL }}
          AIMHARDER_PASSWORD: ${{ secrets.AIMHARDER_PASSWORD }}
          AIMHARDER_BOX_NAME: ${{ secrets.AIMHARDER_BOX_NAME }}
          AIMHARDER_BOX_ID: ${{ secrets.AIMHARDER_BOX_ID }}
          AIMHARDER_HOURS_IN_ADVANCE: ${{ secrets.AIMHARDER_HOURS_IN_ADVANCE }}
          AIMHARDER_BOOKING_GOALS: ${{ secrets.AIMHARDER_BOOKING_GOALS }}
        run: |
          mkdir -p /tmp/aimharderbot-config
          python3 <<'PY' > /tmp/aimharderbot-config/example_config.yaml
          import json, os

          goals = json.loads(os.environ["AIMHARDER_BOOKING_GOALS"])
          lines = [
              "-  user1:",
              "      box-name: {}".format(os.environ["AIMHARDER_BOX_NAME"]),
              "      box-id: {}".format(os.environ["AIMHARDER_BOX_ID"]),
              "      email: {}".format(os.environ["AIMHARDER_EMAIL"]),
              "      password: {}".format(os.environ["AIMHARDER_PASSWORD"]),
              "      booking-goals:",
          ]
          for goal in goals:
              lines.append("        - {}".format(goal))
          lines.extend([
              "      hours-in-advance: {}".format(os.environ["AIMHARDER_HOURS_IN_ADVANCE"]),
              "      exceptions: {}",
          ])
          with open("/tmp/aimharderbot-config/example_config.yaml", "w") as f:
              f.write("\n".join(lines) + "\n")
          PY
          docker run --rm \
            -v /tmp/aimharderbot-config:/usr/src/app/config \
            --name aimharderbot-scheduled \
            aimharderbot:latest \
            --config-filename='example_config.yaml'
