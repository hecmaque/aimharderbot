name: Schedule AimHarder booking

on:
  schedule:
    - cron: '6 16 * * *' # every day at 16:06 UTC (18:06 CEST Spain time)
  workflow_dispatch: {}

jobs:
  run-booking:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        if: github.repository_owner == 'hecmaque'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t aimharderbot:latest .

      - name: Run booking container
        env:
          AIMHARDER_EMAIL: ${{ secrets.AIMHARDER_EMAIL }}
          AIMHARDER_PASSWORD: ${{ secrets.AIMHARDER_PASSWORD }}
          AIMHARDER_BOX_NAME: ${{ secrets.BOX_NAME }}
          AIMHARDER_BOX_ID: ${{ secrets.BOX_ID }}
          AIMHARDER_HOURS_IN_ADVANCE: ${{ secrets.HOURS_IN_ADVANCE }}
          AIMHARDER_BOOKING_GOALS: ${{ secrets.BOOKING_GOALS }}
        run: |
          mkdir -p /tmp/aimharderbot-config
          python3 <<'PY' > /tmp/aimharderbot-config/example_config.yaml
          import json, os

          secrets = {
              'AIMHARDER_EMAIL': os.environ.get('AIMHARDER_EMAIL', '').strip(),
              'AIMHARDER_PASSWORD': os.environ.get('AIMHARDER_PASSWORD', '').strip(),
              'AIMHARDER_BOX_NAME': os.environ.get('AIMHARDER_BOX_NAME', '').strip(),
              'AIMHARDER_BOX_ID': os.environ.get('AIMHARDER_BOX_ID', '').strip(),
              'AIMHARDER_HOURS_IN_ADVANCE': os.environ.get('AIMHARDER_HOURS_IN_ADVANCE', '').strip(),
              'AIMHARDER_BOOKING_GOALS': os.environ.get('AIMHARDER_BOOKING_GOALS', '').strip(),
          }

          if not secrets['AIMHARDER_HOURS_IN_ADVANCE']:
              secrets['AIMHARDER_HOURS_IN_ADVANCE'] = os.environ.get('HOURS_IN_ADVANCE', '').strip()

          missing = [k for k, v in secrets.items() if not v and k != 'AIMHARDER_HOURS_IN_ADVANCE']
          if missing:
              raise SystemExit(f"Missing secrets: {', '.join(missing)}")

          if not secrets['AIMHARDER_HOURS_IN_ADVANCE']:
              print('WARNING: HOURS_IN_ADVANCE secret not found; using default 24')
              secrets['AIMHARDER_HOURS_IN_ADVANCE'] = '24'

          try:
              goals = json.loads(secrets['AIMHARDER_BOOKING_GOALS'])
          except json.JSONDecodeError as ex:
              raise SystemExit(f"AIMHARDER_BOOKING_GOALS is not valid JSON: {ex.msg}")

          if not isinstance(goals, list) or not goals:
              raise SystemExit("AIMHARDER_BOOKING_GOALS must be a non-empty JSON array.")

          lines = [
              "user1:",
              f"  box-name: {secrets['AIMHARDER_BOX_NAME']}",
              f"  box-id: {secrets['AIMHARDER_BOX_ID']}",
              f"  email: {secrets['AIMHARDER_EMAIL']}",
              f"  password: {secrets['AIMHARDER_PASSWORD']}",
              "  booking-goals:",
          ]
          for goal in goals:
              lines.append(f"    - {goal}")
          lines.extend([
              f"  hours-in-advance: {secrets['AIMHARDER_HOURS_IN_ADVANCE']}",
              "  exceptions: {}",
          ])
          with open('/tmp/aimharderbot-config/example_config.yaml', 'w') as f:
              f.write('\n'.join(lines) + '\n')
          PY
          cat /tmp/aimharderbot-config/example_config.yaml
          docker run --rm \
            -v /tmp/aimharderbot-config:/usr/src/app/config \
            --name aimharderbot-scheduled \
            aimharderbot:latest \
            --config-filename='example_config.yaml'
