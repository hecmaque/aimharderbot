name: Schedule AimHarder booking

on:
  schedule:
    - cron: '30 7 * * *' # every day at 07:30 UTC
  workflow_dispatch: {}

jobs:
  run-booking:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        if: github.repository_owner == 'hecmaque'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t aimharderbot:latest .

      - name: Run booking container
        env:
          AIMHARDER_EMAIL: ${{ secrets.AIMHARDER_EMAIL }}
          AIMHARDER_PASSWORD: ${{ secrets.AIMHARDER_PASSWORD }}
          AIMHARDER_BOX_NAME: ${{ secrets.AIMHARDER_BOX_NAME }}
          AIMHARDER_BOX_ID: ${{ secrets.AIMHARDER_BOX_ID }}
          AIMHARDER_HOURS_IN_ADVANCE: ${{ secrets.AIMHARDER_HOURS_IN_ADVANCE }}
          AIMHARDER_BOOKING_GOALS: ${{ secrets.AIMHARDER_BOOKING_GOALS }}
        run: |
          mkdir -p /tmp/aimharderbot-config
          cat > /tmp/aimharderbot-config/example_config.yaml <<'EOF'
-  user1:
      box-name: ${AIMHARDER_BOX_NAME}
      box-id: ${AIMHARDER_BOX_ID}
      email: ${AIMHARDER_EMAIL}
      password: ${AIMHARDER_PASSWORD}
      booking-goals:
$(python3 - <<'PY'
import os, json

goals = json.loads(os.environ['AIMHARDER_BOOKING_GOALS'])
for goal in goals:
    print('        - ' + goal)
PY
)
      hours-in-advance: ${AIMHARDER_HOURS_IN_ADVANCE}
      exceptions: {}
EOF
          docker run --rm \
            -v /tmp/aimharderbot-config:/usr/src/app/config \
            --name aimharderbot-scheduled \
            aimharderbot:latest \
            --config-filename='example_config.yaml'
